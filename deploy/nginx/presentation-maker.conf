# EC2 nginx reverse proxy for presentation-maker (staging), port 3000.
# The other service on this box (port 8081) has its own separate server
# block / domain — this file doesn't touch it.
#
# TLS: Cloudflare Origin CA wildcard cert (*.shomvob.com), not Let's Encrypt —
# DNS for proposal-builder.shomvob.com is Proxied (orange cloud) in Cloudflare,
# so Cloudflare is the only thing that ever talks to this cert directly.
#
# Install on the EC2 host:
#   sudo cp presentation-maker.conf /etc/nginx/sites-available/presentation-maker.conf
#   sudo ln -s /etc/nginx/sites-available/presentation-maker.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name proposal-builder.shomvob.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name proposal-builder.shomvob.com;

    ssl_certificate     /etc/nginx/ssl/wildcard-shomvob.pem;
    ssl_certificate_key /etc/nginx/ssl/wildcard-shomvob.key;

    # PDF export payloads (slide content with embedded images) can be sizable.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # PDF export routes launch a headless Chromium — app/api/export-pdf*/
        # route.ts declares maxDuration=60s, so give real headroom past that.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Next.js App Router streams responses (Suspense boundaries); nginx
        # must not buffer the whole response before forwarding it.
        proxy_buffering off;
    }
}
